name: CI - Build, Test, and Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        compiler: [gcc, clang]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential
        # Install clang if needed
        if [ "${{ matrix.compiler }}" = "clang" ]; then
          sudo apt-get install -y clang
        fi
    
    - name: Compile with ${{ matrix.compiler }}
      run: |
        # Create build directory
        mkdir -p build
        cd build
        
        # Configure build with selected compiler
        if [ "${{ matrix.compiler }}" = "gcc" ]; then
          CC=gcc CXX=g++ cmake .. -DCMAKE_BUILD_TYPE=Debug
        else
          CC=clang CXX=clang++ cmake .. -DCMAKE_BUILD_TYPE=Debug
        fi
        
        # Build
        cmake --build . --config Debug
      continue-on-error: true
    
    - name: Run unit tests
      run: |
        cd build
        ctest --output-on-failure
      continue-on-error: true
    
    - name: Run linting (cppcheck)
      run: |
        sudo apt-get install -y cppcheck
        cppcheck --enable=all --std=c99 src/ include/ tests/ 2>&1 | tee cppcheck-report.txt
      continue-on-error: true
    
    - name: Run linting (cpplint)
      run: |
        pip install cpplint
        cpplint --filter=-legal/copyright src/*.c include/*.h 2>&1 | tee cpplint-report.txt || true
      continue-on-error: true
    
    - name: Upload build artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts-${{ matrix.compiler }}
        path: |
          build/
          *-report.txt
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.compiler }}
        path: build/Testing/

  code-review:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Design artifact validation
      run: |
        # Check that test design artifacts exist
        if [ ! -f "Docs/unit-test-design.md" ]; then
          echo "ERROR: Docs/unit-test-design.md not found"
          exit 1
        fi
        
        if [ ! -f "Docs/ut-design-testcase.csv" ]; then
          echo "ERROR: Docs/ut-design-testcase.csv not found"
          exit 1
        fi
        
        if [ ! -f "Docs/review-report.md" ]; then
          echo "WARNING: Docs/review-report.md not found - run review-design.py to generate"
        fi
        
        echo "Design artifacts validation passed"
    
    - name: Check requirements traceability
      run: |
        # Basic check that requirements are referenced in test CSV
        if grep -q "Req:" Docs/ut-design-testcase.csv; then
          echo "Requirement references found in test CSV"
        else
          echo "WARNING: No requirement references found in test CSV"
        fi

  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-test, code-review]
    if: success()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.AWS_SSH_PRIVATE_KEY }}" > ~/.ssh/aws-key.pem
        chmod 600 ~/.ssh/aws-key.pem
        ssh-keyscan -H ${{ secrets.AWS_INSTANCE_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
    
    - name: Deploy and update timestamp
      run: |
        # Generate current timestamp in IST format (UTC+5:30)
        IST_TIMESTAMP=$(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M:%S %Z')
        
        # SSH to AWS instance and update deployment status file
        ssh -i ~/.ssh/aws-key.pem ${{ secrets.AWS_SSH_USER }}@${{ secrets.AWS_INSTANCE_HOST }} << EOF
          # Create or update deployment status file with timestamp
          DEPLOY_STATUS_FILE="/home/${{ secrets.AWS_SSH_USER }}/dcm-mvp-deployment-status.txt"
          
          echo "Deployment Status:" > \$DEPLOY_STATUS_FILE
          echo "Last Deployment: \$(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M:%S %Z')" >> \$DEPLOY_STATUS_FILE
          echo "Branch: ${{ github.ref }}" >> \$DEPLOY_STATUS_FILE
          echo "Commit SHA: ${{ github.sha }}" >> \$DEPLOY_STATUS_FILE
          echo "Commit Message: ${{ github.event.head_commit.message }}" >> \$DEPLOY_STATUS_FILE
          echo "" >> \$DEPLOY_STATUS_FILE
          echo "Pipeline Status: SUCCESS" >> \$DEPLOY_STATUS_FILE
          
          cat \$DEPLOY_STATUS_FILE
        EOF
    
    - name: Verify deployment
      run: |
        echo "Deployment completed successfully"
        ssh -i ~/.ssh/aws-key.pem ${{ secrets.AWS_SSH_USER }}@${{ secrets.AWS_INSTANCE_HOST }} \
          "echo 'AWS Instance Verification:' && uptime && echo 'DCM MVP Deployment Status:' && cat /home/${{ secrets.AWS_SSH_USER }}/dcm-mvp-deployment-status.txt"
    
    - name: Cleanup SSH key
      if: always()
      run: |
        rm -f ~/.ssh/aws-key.pem

  summary:
    runs-on: ubuntu-latest
    needs: [build-and-test, code-review, deploy]
    if: always()
    
    steps:
    - name: Check status
      run: |
        echo "## CI Pipeline Summary"
        echo "Build and test: ${{ needs.build-and-test.result }}"
        echo "Code review: ${{ needs.code-review.result }}"
        echo "Deployment: ${{ needs.deploy.result }}"
        
        if [ "${{ needs.build-and-test.result }}" = "failure" ]; then
          echo "❌ Build or test failed"
          exit 1
        fi
        
        if [ "${{ needs.code-review.result }}" = "failure" ]; then
          echo "❌ Code review checks failed"
          exit 1
        fi
        
        if [ "${{ needs.deploy.result }}" = "failure" ]; then
          echo "❌ Deployment failed"
          exit 1
        fi
        
        echo "✅ All checks passed"
