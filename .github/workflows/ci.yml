name: CI - Build, Test, and Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        compiler: [gcc, clang]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential
        # Install clang if needed
        if [ "${{ matrix.compiler }}" = "clang" ]; then
          sudo apt-get install -y clang
        fi
    
    - name: Compile with ${{ matrix.compiler }}
      run: |
        # Create build directory
        mkdir -p build
        cd build
        
        # Configure build with selected compiler
        if [ "${{ matrix.compiler }}" = "gcc" ]; then
          CC=gcc CXX=g++ cmake .. -DCMAKE_BUILD_TYPE=Debug
        else
          CC=clang CXX=clang++ cmake .. -DCMAKE_BUILD_TYPE=Debug
        fi
        
        # Build
        cmake --build . --config Debug
      continue-on-error: true
    
    - name: Run unit tests
      run: |
        cd build
        ctest --output-on-failure
      continue-on-error: true
    
    - name: Run linting (cppcheck)
      run: |
        sudo apt-get install -y cppcheck
        cppcheck --enable=all --std=c99 src/ include/ tests/ 2>&1 | tee cppcheck-report.txt
      continue-on-error: true
    
    - name: Run linting (cpplint)
      run: |
        pip install cpplint
        cpplint --filter=-legal/copyright src/*.c include/*.h 2>&1 | tee cpplint-report.txt || true
      continue-on-error: true
    
    - name: Upload build artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts-${{ matrix.compiler }}
        path: |
          build/
          *-report.txt
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.compiler }}
        path: build/Testing/

  code-review:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Design artifact validation
      run: |
        # Check that test design artifacts exist
        if [ ! -f "Docs/unit-test-design.md" ]; then
          echo "ERROR: Docs/unit-test-design.md not found"
          exit 1
        fi
        
        if [ ! -f "Docs/ut-design-testcase.csv" ]; then
          echo "ERROR: Docs/ut-design-testcase.csv not found"
          exit 1
        fi
        
        if [ ! -f "Docs/review-report.md" ]; then
          echo "WARNING: Docs/review-report.md not found - run review-design.py to generate"
        fi
        
        echo "Design artifacts validation passed"
    
    - name: Check requirements traceability
      run: |
        # Basic check that requirements are referenced in test CSV
        if grep -q "Req:" Docs/ut-design-testcase.csv; then
          echo "Requirement references found in test CSV"
        else
          echo "WARNING: No requirement references found in test CSV"
        fi

  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-test, code-review]
    if: success()
    continue-on-error: true
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Validate AWS secrets
      env:
        AWS_USER: ${{ secrets.AWS_SSH_USER }}
        AWS_HOST: ${{ secrets.AWS_INSTANCE_HOST }}
        SSH_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
      run: |
        echo "=== AWS Secrets Validation ==="
        ISSUES=0
        
        if [ -z "$AWS_HOST" ]; then
          echo "❌ Missing secret: AWS_INSTANCE_HOST"
          echo "   Add to: Settings → Secrets and variables → Actions"
          ISSUES=1
        else
          echo "✅ AWS_INSTANCE_HOST is configured"
        fi
        
        if [ -z "$AWS_USER" ]; then
          echo "❌ Missing secret: AWS_SSH_USER"
          echo "   Add to: Settings → Secrets and variables → Actions"
          ISSUES=1
        else
          echo "✅ AWS_SSH_USER is configured (${#AWS_USER} chars)"
        fi
        
        if [ -z "$SSH_KEY" ]; then
          echo "❌ Missing secret: AWS_SSH_PRIVATE_KEY"
          echo "   Add to: Settings → Secrets and variables → Actions"
          ISSUES=1
        else
          SSH_KEY_SIZE=${#SSH_KEY}
          echo "ℹ️  AWS_SSH_PRIVATE_KEY size: $SSH_KEY_SIZE bytes"
          
          if [ $SSH_KEY_SIZE -lt 500 ]; then
            echo "❌ WARNING: SSH key is very small ($SSH_KEY_SIZE bytes)"
            echo "   Typical RSA keys are 1500-3000 bytes"
            echo "   This suggests the key content is incomplete"
            ISSUES=1
          elif echo "$SSH_KEY" | grep -q "BEGIN.*PRIVATE KEY"; then
            echo "✅ SSH key contains valid BEGIN marker"
          else
            echo "❌ SSH key missing 'BEGIN PRIVATE KEY' marker"
            ISSUES=1
          fi
        fi
        
        if [ $ISSUES -eq 1 ]; then
          echo ""
          echo "⚠️  DEPLOYMENT WILL BE SKIPPED due to missing/invalid secrets"
          echo ""
          echo "To enable deployment:"
          echo ""
          echo "1. AWS_INSTANCE_HOST - Your EC2 instance IP or hostname"
          echo "   Example: ec2-1-2-3-4.compute.amazonaws.com"
          echo ""
          echo "2. AWS_SSH_USER - SSH username"
          echo "   Example: ubuntu (for Ubuntu AMI) or ec2-user (for Amazon Linux)"
          echo ""
          echo "3. AWS_SSH_PRIVATE_KEY - Complete contents of your .pem file"
          echo "   ⚠️  IMPORTANT: Copy the ENTIRE file including:"
          echo "   -----BEGIN RSA PRIVATE KEY-----"
          echo "   [many lines of base64 encoded data]"
          echo "   -----END RSA PRIVATE KEY-----"
          echo ""
          echo "   Do NOT include:"
          echo "   - Extra spaces or blank lines before/after"
          echo "   - Any other text or comments"
          echo "   - Multiple keys"
          exit 0
        fi
        
        echo ""
        echo "✅ All AWS secrets appear valid - deployment will proceed"
    
    - name: Setup SSH key
      env:
        SSH_PRIVATE_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
      run: |
        if [ -z "$SSH_PRIVATE_KEY" ]; then
          echo "❌ ERROR: SSH_PRIVATE_KEY secret is empty"
          echo ""
          echo "To fix this:"
          echo "1. Copy the ENTIRE contents of your .pem file (including BEGIN and END lines)"
          echo "2. Go to GitHub repo → Settings → Secrets and variables → Actions"
          echo "3. Edit AWS_SSH_PRIVATE_KEY and paste the complete key"
          echo "4. Make sure NO extra spaces or lines are included"
          echo ""
          echo "Example .pem file format:"
          echo "-----BEGIN RSA PRIVATE KEY-----"
          echo "MIIEpAIBAAKCAQEA..."
          echo "...many lines of base64..."
          echo "-----END RSA PRIVATE KEY-----"
          exit 1
        fi
        
        mkdir -p ~/.ssh
        
        # Debug: show secret size
        SECRET_SIZE=${#SSH_PRIVATE_KEY}
        echo "ℹ️  Secret size: $SECRET_SIZE bytes"
        
        # Use printf instead of echo to handle newlines better
        printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/aws-key.pem
        chmod 600 ~/.ssh/aws-key.pem
        
        # Verify key was written
        if [ ! -f ~/.ssh/aws-key.pem ]; then
          echo "❌ ERROR: Failed to create SSH key file"
          exit 1
        fi
        
        # Check key file has content
        KEY_SIZE=$(wc -c < ~/.ssh/aws-key.pem)
        echo "ℹ️  SSH key file size: $KEY_SIZE bytes"
        
        # Check for BEGIN/END markers
        if ! grep -q "BEGIN.*PRIVATE KEY" ~/.ssh/aws-key.pem; then
          echo "❌ ERROR: SSH key file missing 'BEGIN PRIVATE KEY' marker"
          echo "This usually means the secret was not copied correctly."
          echo ""
          echo "Common mistakes:"
          echo "  - Only copied part of the key"
          echo "  - Added extra text before/after the key"
          echo "  - Used the wrong file (not the .pem file)"
          exit 1
        fi
        
        if ! grep -q "END.*PRIVATE KEY" ~/.ssh/aws-key.pem; then
          echo "❌ ERROR: SSH key file missing 'END PRIVATE KEY' marker"
          exit 1
        fi
        
        if [ $KEY_SIZE -lt 1000 ]; then
          echo "❌ ERROR: SSH key file too small ($KEY_SIZE bytes)"
          echo "Typical RSA private keys are 1500-3000 bytes"
          echo ""
          echo "Please verify:"
          echo "  1. You copied the complete .pem file (all lines)"
          echo "  2. The secret contains only the key (no extra text)"
          echo "  3. No lines were accidentally deleted"
          exit 1
        fi
        
        echo "✅ SSH key setup complete ($KEY_SIZE bytes)"
        echo "✅ Key contains valid BEGIN/END markers"
    
    - name: Configure SSH known_hosts
      env:
        AWS_HOST: ${{ secrets.AWS_INSTANCE_HOST }}
      run: |
        if [ -z "$AWS_HOST" ]; then
          echo "Skipping SSH configuration - secrets not configured"
          exit 0
        fi
        
        mkdir -p ~/.ssh
        
        # Add host with timeout
        echo "Scanning host: $AWS_HOST"
        if ssh-keyscan -H -T 5 "$AWS_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
          echo "✅ Host key added to known_hosts"
        else
          echo "⚠️  Could not scan host key (host may be unreachable)"
        fi
    
    - name: Test SSH connection
      env:
        AWS_USER: ${{ secrets.AWS_SSH_USER }}
        AWS_HOST: ${{ secrets.AWS_INSTANCE_HOST }}
      run: |
        if [ -z "$AWS_HOST" ] || [ -z "$AWS_USER" ]; then
          echo "Skipping SSH test - secrets not configured"
          exit 0
        fi
        
        if [ ! -f ~/.ssh/aws-key.pem ]; then
          echo "ERROR: SSH key not found"
          exit 1
        fi
        
        echo "Testing SSH connection to ${AWS_USER}@${AWS_HOST}..."
        
        if ssh -v \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o BatchMode=yes \
            -i ~/.ssh/aws-key.pem \
            "${AWS_USER}@${AWS_HOST}" "echo '✅ SSH connection successful'" 2>&1; then
          echo "✅ SSH connection test passed"
        else
          echo "❌ SSH connection test failed"
          exit 1
        fi
    
    - name: Deploy and update timestamp
      env:
        AWS_USER: ${{ secrets.AWS_SSH_USER }}
        AWS_HOST: ${{ secrets.AWS_INSTANCE_HOST }}
        GIT_BRANCH: ${{ github.ref }}
        GIT_SHA: ${{ github.sha }}
      run: |
        if [ -z "$AWS_HOST" ] || [ -z "$AWS_USER" ]; then
          echo "Skipping deployment - secrets not configured"
          exit 0
        fi
        
        if [ ! -f ~/.ssh/aws-key.pem ]; then
          echo "ERROR: SSH key not found"
          exit 1
        fi
        
        echo "Deploying to ${AWS_USER}@${AWS_HOST}..."
        
        ssh -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o BatchMode=yes \
            -i ~/.ssh/aws-key.pem \
            "${AWS_USER}@${AWS_HOST}" << 'SSHEOF'
        IST_TIME=$(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M:%S %Z')
        DEPLOY_FILE=dcm-mvp-deployment-status.txt
        
        cat > "$DEPLOY_FILE" << EOF
        Deployment Status:
        Last Deployment: $IST_TIME
        Branch: $GIT_BRANCH
        Commit SHA: $GIT_SHA
        Pipeline Status: SUCCESS
        EOF
        
        if [ -f "$DEPLOY_FILE" ]; then
          echo "✅ Deployment file created successfully"
          echo "File contents:"
          cat "$DEPLOY_FILE"
        else
          echo "❌ Failed to create deployment file"
          exit 1
        fi
        SSHEOF
    
    - name: Verify deployment
      env:
        AWS_USER: ${{ secrets.AWS_SSH_USER }}
        AWS_HOST: ${{ secrets.AWS_INSTANCE_HOST }}
      run: |
        if [ -z "$AWS_HOST" ] || [ -z "$AWS_USER" ]; then
          echo "Skipping verification - secrets not configured"
          exit 0
        fi
        
        if [ ! -f ~/.ssh/aws-key.pem ]; then
          echo "ERROR: SSH key not found"
          exit 1
        fi
        
        echo "=== Verifying deployment on ${AWS_USER}@${AWS_HOST} ==="
        
        ssh -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o BatchMode=yes \
            -i ~/.ssh/aws-key.pem \
            "${AWS_USER}@${AWS_HOST}" << 'SSHEOF'
        echo ""
        echo "=== AWS Instance Information ==="
        uptime
        echo ""
        echo "=== Deployment Status File ==="
        if [ -f dcm-mvp-deployment-status.txt ]; then
          cat dcm-mvp-deployment-status.txt
          echo "✅ Deployment verification successful"
        else
          echo "❌ Deployment status file not found"
          exit 1
        fi
        SSHEOF
    
    - name: Cleanup SSH key
      if: always()
      run: |
        if [ -f ~/.ssh/aws-key.pem ]; then
          rm -f ~/.ssh/aws-key.pem
          echo "✅ SSH key cleaned up securely"
        fi

  summary:
    runs-on: ubuntu-latest
    needs: [build-and-test, code-review, deploy]
    if: always()
    
    steps:
    - name: Check status
      run: |
        echo "## CI Pipeline Summary"
        echo "Build and test: ${{ needs.build-and-test.result }}"
        echo "Code review: ${{ needs.code-review.result }}"
        echo "Deployment: ${{ needs.deploy.result }}"
        
        if [ "${{ needs.build-and-test.result }}" = "failure" ]; then
          echo "❌ Build or test failed"
          exit 1
        fi
        
        if [ "${{ needs.code-review.result }}" = "failure" ]; then
          echo "❌ Code review checks failed"
          exit 1
        fi
        
        if [ "${{ needs.deploy.result }}" = "failure" ]; then
          echo "❌ Deployment failed"
          exit 1
        fi
        
        echo "✅ All checks passed"
