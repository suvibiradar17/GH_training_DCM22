name: CI - Build, Test, and Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        compiler: [gcc, clang]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential
        # Install clang if needed
        if [ "${{ matrix.compiler }}" = "clang" ]; then
          sudo apt-get install -y clang
        fi
    
    - name: Compile with ${{ matrix.compiler }}
      run: |
        # Create build directory
        mkdir -p build
        cd build
        
        # Configure build with selected compiler
        if [ "${{ matrix.compiler }}" = "gcc" ]; then
          CC=gcc CXX=g++ cmake .. -DCMAKE_BUILD_TYPE=Debug
        else
          CC=clang CXX=clang++ cmake .. -DCMAKE_BUILD_TYPE=Debug
        fi
        
        # Build
        cmake --build . --config Debug
      continue-on-error: true
    
    - name: Run unit tests
      run: |
        cd build
        ctest --output-on-failure
      continue-on-error: true
    
    - name: Run linting (cppcheck)
      run: |
        sudo apt-get install -y cppcheck
        cppcheck --enable=all --std=c99 src/ include/ tests/ 2>&1 | tee cppcheck-report.txt
      continue-on-error: true
    
    - name: Run linting (cpplint)
      run: |
        pip install cpplint
        cpplint --filter=-legal/copyright src/*.c include/*.h 2>&1 | tee cpplint-report.txt || true
      continue-on-error: true
    
    - name: Upload build artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts-${{ matrix.compiler }}
        path: |
          build/
          *-report.txt
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.compiler }}
        path: build/Testing/

  code-review:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Design artifact validation
      run: |
        # Check that test design artifacts exist
        if [ ! -f "Docs/unit-test-design.md" ]; then
          echo "ERROR: Docs/unit-test-design.md not found"
          exit 1
        fi
        
        if [ ! -f "Docs/ut-design-testcase.csv" ]; then
          echo "ERROR: Docs/ut-design-testcase.csv not found"
          exit 1
        fi
        
        if [ ! -f "Docs/review-report.md" ]; then
          echo "WARNING: Docs/review-report.md not found - run review-design.py to generate"
        fi
        
        echo "Design artifacts validation passed"
    
    - name: Check requirements traceability
      run: |
        if grep -q "Req:" Docs/ut-design-testcase.csv; then
          echo "Requirement references found in test CSV"
        else
          echo "WARNING: No requirement references found in test CSV"
        fi

  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-test, code-review]
    if: always()
    continue-on-error: true
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Check AWS secrets configuration
      id: check_secrets
      env:
        AWS_USER: ${{ secrets.AWS_SSH_USER }}
        AWS_HOST: ${{ secrets.AWS_INSTANCE_HOST }}
        SSH_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
      run: |
        echo "=== AWS Deployment Secrets Check ==="
        echo ""
        
        SECRETS_OK=true
        
        if [ -z "$AWS_HOST" ]; then
          echo "❌ AWS_INSTANCE_HOST: NOT CONFIGURED"
          SECRETS_OK=false
        else
          echo "✅ AWS_INSTANCE_HOST: Configured (${#AWS_HOST} chars)"
        fi
        
        if [ -z "$AWS_USER" ]; then
          echo "❌ AWS_SSH_USER: NOT CONFIGURED"
          SECRETS_OK=false
        else
          echo "✅ AWS_SSH_USER: Configured (${#AWS_USER} chars)"
        fi
        
        if [ -z "$SSH_KEY" ]; then
          echo "❌ AWS_SSH_PRIVATE_KEY: NOT CONFIGURED"
          SECRETS_OK=false
        else
          SSH_SIZE=${#SSH_KEY}
          echo "ℹ️  AWS_SSH_PRIVATE_KEY: $SSH_SIZE bytes"
          
          if [ $SSH_SIZE -lt 1000 ]; then
            echo "❌ ERROR: SSH key is too small ($SSH_SIZE bytes)"
            echo "   Expected: 1500-3000 bytes for a valid RSA key"
            echo "   The key content is INCOMPLETE - you did not copy the entire .pem file"
            SECRETS_OK=false
          elif echo "$SSH_KEY" | grep -q "BEGIN.*PRIVATE KEY"; then
            echo "✅ SSH key contains valid BEGIN marker"
          else
            echo "❌ SSH key missing BEGIN marker"
            SECRETS_OK=false
          fi
          
          if echo "$SSH_KEY" | grep -q "END.*PRIVATE KEY"; then
            echo "✅ SSH key contains valid END marker"
          else
            echo "❌ SSH key missing END marker"
            SECRETS_OK=false
          fi
        fi
        
        if [ "$SECRETS_OK" = "true" ]; then
          echo "deploy_enabled=true" >> $GITHUB_OUTPUT
          echo ""
          echo "✅ All secrets are properly configured!"
        else
          echo "deploy_enabled=false" >> $GITHUB_OUTPUT
          echo ""
          echo "⚠️  DEPLOYMENT WILL BE SKIPPED - SECRETS NOT CONFIGURED"
          echo ""
          echo "To enable deployment:"
          echo "1. Read: DEPLOYMENT_SETUP.md"
          echo "2. Add these secrets to: Settings → Secrets and variables → Actions"
          echo "   - AWS_INSTANCE_HOST (your EC2 IP or hostname)"
          echo "   - AWS_SSH_USER (e.g., ubuntu or ec2-user)"
          echo "   - AWS_SSH_PRIVATE_KEY (complete .pem file content - ALL lines!)"
          echo "3. Re-run this workflow after adding secrets"
        fi
    
    - name: Setup SSH key
      if: steps.check_secrets.outputs.deploy_enabled == 'true'
      env:
        SSH_PRIVATE_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
      run: |
        echo "Setting up SSH key..."
        mkdir -p ~/.ssh
        
        printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/aws-key.pem
        chmod 600 ~/.ssh/aws-key.pem
        
        if [ ! -f ~/.ssh/aws-key.pem ]; then
          echo "❌ ERROR: Failed to create SSH key file"
          exit 1
        fi
        
        KEY_SIZE=$(wc -c < ~/.ssh/aws-key.pem)
        echo "✅ SSH key created ($KEY_SIZE bytes)"
        
        if ! grep -q "BEGIN.*PRIVATE KEY" ~/.ssh/aws-key.pem; then
          echo "❌ ERROR: Key missing BEGIN marker"
          exit 1
        fi
        
        if ! grep -q "END.*PRIVATE KEY" ~/.ssh/aws-key.pem; then
          echo "❌ ERROR: Key missing END marker"
          exit 1
        fi
        
        echo "✅ SSH key validation passed"
    
    - name: Configure known_hosts
      if: steps.check_secrets.outputs.deploy_enabled == 'true'
      env:
        AWS_HOST: ${{ secrets.AWS_INSTANCE_HOST }}
      run: |
        echo "Adding host to known_hosts: $AWS_HOST"
        mkdir -p ~/.ssh
        
        ssh-keygen -R "$AWS_HOST" -f ~/.ssh/known_hosts 2>/dev/null || true
        
        if ssh-keyscan -H -T 5 "$AWS_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
          echo "✅ Host key added to known_hosts"
        else
          echo "⚠️  Could not scan host key (host may be unreachable initially)"
        fi
    
    - name: Test SSH connection
      if: steps.check_secrets.outputs.deploy_enabled == 'true'
      env:
        AWS_USER: ${{ secrets.AWS_SSH_USER }}
        AWS_HOST: ${{ secrets.AWS_INSTANCE_HOST }}
      run: |
        echo "Testing SSH connection to ${AWS_USER}@${AWS_HOST}..."
        
        if ssh -o ConnectTimeout=15 \
               -o StrictHostKeyChecking=accept-new \
               -o UserKnownHostsFile=~/.ssh/known_hosts \
               -o BatchMode=yes \
               -i ~/.ssh/aws-key.pem \
               "${AWS_USER}@${AWS_HOST}" "whoami"; then
          echo ""
          echo "✅ SSH connection successful!"
        else
          echo ""
          echo "❌ SSH connection failed"
          exit 1
        fi
    
    - name: Deploy and create status file
      if: steps.check_secrets.outputs.deploy_enabled == 'true'
      env:
        AWS_USER: ${{ secrets.AWS_SSH_USER }}
        AWS_HOST: ${{ secrets.AWS_INSTANCE_HOST }}
        GIT_BRANCH: ${{ github.ref }}
        GIT_SHA: ${{ github.sha }}
        COMMIT_MSG: ${{ github.event.head_commit.message }}
      run: |
        echo "Deploying to ${AWS_USER}@${AWS_HOST}..."
        echo ""
        
        ssh -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o BatchMode=yes \
            -i ~/.ssh/aws-key.pem \
            "${AWS_USER}@${AWS_HOST}" << 'DEPLOY_SCRIPT'
        IST_TIME=$(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M:%S %Z')
        STATUS_FILE="dcm-mvp-deployment-status.txt"
        
        cat > "$STATUS_FILE" << EOF
        ============================================
        DCM MVP Deployment Status
        ============================================
        Deployment Time: $IST_TIME
        
        Git Information:
          Branch: $GIT_BRANCH
          Commit SHA: $GIT_SHA
          Commit Message: $COMMIT_MSG
        
        Pipeline Status: SUCCESS ✅
        ============================================
        EOF
        
        if [ -f "$STATUS_FILE" ]; then
          echo "✅ Status file created successfully"
          echo ""
          echo "File contents:"
          cat "$STATUS_FILE"
        else
          echo "❌ ERROR: Failed to create status file"
          exit 1
        fi
        DEPLOY_SCRIPT
    
    - name: Verify deployment
      if: steps.check_secrets.outputs.deploy_enabled == 'true'
      env:
        AWS_USER: ${{ secrets.AWS_SSH_USER }}
        AWS_HOST: ${{ secrets.AWS_INSTANCE_HOST }}
      run: |
        echo "Verifying deployment..."
        echo ""
        
        ssh -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o BatchMode=yes \
            -i ~/.ssh/aws-key.pem \
            "${AWS_USER}@${AWS_HOST}" << 'VERIFY_SCRIPT'
        echo "=== AWS Instance Info ==="
        echo "Hostname: $(hostname)"
        echo "Uptime: $(uptime)"
        echo ""
        echo "=== Deployment Status ==="
        if [ -f "dcm-mvp-deployment-status.txt" ]; then
          cat dcm-mvp-deployment-status.txt
          echo "✅ Deployment verified successfully"
        else
          echo "❌ Status file not found"
          exit 1
        fi
        VERIFY_SCRIPT
    
    - name: Cleanup SSH key
      if: always()
      run: |
        if [ -f ~/.ssh/aws-key.pem ]; then
          rm -f ~/.ssh/aws-key.pem
          echo "✅ SSH key cleaned up securely"
        fi
    
    - name: Deployment summary
      if: always()
      run: |
        echo ""
        echo "========================================="
        echo "Deployment Job Summary"
        echo "========================================="
        if [ "${{ steps.check_secrets.outputs.deploy_enabled }}" = "true" ]; then
          echo "✅ Deployment: CONFIGURED AND EXECUTED"
        else
          echo "ℹ️  Deployment: SKIPPED (Secrets not configured)"
          echo ""
          echo "Next steps:"
          echo "1. Read DEPLOYMENT_SETUP.md"
          echo "2. Add required GitHub secrets"
          echo "3. Re-run this workflow"
        fi
        echo "========================================="

  summary:
    runs-on: ubuntu-latest
    needs: [build-and-test, code-review, deploy]
    if: always()
    
    steps:
    - name: Check status
      run: |
        echo "## CI Pipeline Summary"
        echo "Build and test: ${{ needs.build-and-test.result }}"
        echo "Code review: ${{ needs.code-review.result }}"
        echo "Deployment: ${{ needs.deploy.result }}"
        
        if [ "${{ needs.build-and-test.result }}" = "failure" ]; then
          echo "❌ Build or test failed"
          exit 1
        fi
        
        if [ "${{ needs.code-review.result }}" = "failure" ]; then
          echo "❌ Code review checks failed"
          exit 1
        fi
        
        echo "✅ All checks passed"
